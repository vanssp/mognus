services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mog-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./backend:/app
    networks:
      - app-network
    depends_on:
      - ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mog-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    container_name: mog-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  ollama_data:
