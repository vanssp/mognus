services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mog-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./backend:/app
    networks:
      - app-network
    depends_on:
      ollama:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mog-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-network

  ollama:
    image: ollama/ollama:latest
    container_name: mog-ollama
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_THREADS=2
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=2m
      - OLLAMA_NUM_PARALLEL=1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 2800M

  postgres:
    image: postgres:16
    container_name: mog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-n8n}
      POSTGRES_DB: ${POSTGRES_DB:-automation}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./automation/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-automation}" ]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  app-network:
    driver: bridge

volumes:
  ollama_data:
  pgdata:
