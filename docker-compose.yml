version: "3.8"

services:
  backend:
    build: .
    container_name: mog-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - .:/app   # горячая перезагрузка кода при разработке
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mog-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
